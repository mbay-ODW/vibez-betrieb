# Traefik – Verwaltungsoberflächen (Stacks ldap, portainer, dozzle, uptime), jede Adresse hinter Authelia.
# Wer was darf, steht in config/authelia/configuration.yml (LDAP-Gruppen).
http:
  middlewares:
    # Vor Authelia: alle vom Client mitgeschickten Identitäts-Header entfernen (sonst könnte ein Header, den
    # Authelia nicht setzt, unverändert durchrutschen). Authelia setzt sie danach neu.
    remote-weg:
      headers:
        customRequestHeaders:
          Remote-User: ""
          Remote-Groups: ""
          Remote-Name: ""
          Remote-Email: ""
          X-Proxy-Secret: ""
    # Nach Authelia: Geheimnis für die App (sie glaubt den Remote-*-Headern nur damit)
    proxy-geheimnis:
      headers:
        customRequestHeaders:
          X-Proxy-Secret: '{{ env "VN_PROXY_SECRET" }}'
    authelia:
      forwardAuth:
        address: http://authelia:9091/api/authz/forward-auth
        trustForwardHeader: true          # X-Forwarded-* setzt nur cloudflared (trustedIPs in traefik.yml)
        authResponseHeaders: [Remote-User, Remote-Groups, Remote-Email, Remote-Name]
    admin-header:
      headers:
        stsSeconds: 31536000
        forceSTSHeader: true
        contentTypeNosniff: true
        referrerPolicy: same-origin
        frameDeny: true

  routers:
    auth:
      entryPoints: [web]
      rule: Host(`auth.vibez-odenwald.de`)
      service: authelia
      middlewares: [admin-header, bremse]
    ldap:
      entryPoints: [web]
      rule: Host(`ldap.vibez-odenwald.de`)
      service: lldap
      middlewares: [remote-weg, admin-header, authelia]
    portainer:
      entryPoints: [web]
      rule: Host(`portainer.vibez-odenwald.de`)
      service: portainer
      middlewares: [remote-weg, admin-header, authelia]
    logs:
      entryPoints: [web]
      rule: Host(`logs.vibez-odenwald.de`)
      service: dozzle
      middlewares: [remote-weg, admin-header, authelia]
    status:
      entryPoints: [web]
      rule: Host(`status.vibez-odenwald.de`)
      service: uptime-kuma
      middlewares: [remote-weg, admin-header, authelia]

  services:
    authelia:
      loadBalancer:
        servers: [{url: "http://authelia:9091"}]
    lldap:
      loadBalancer:
        servers: [{url: "http://lldap:17170"}]
    portainer:
      loadBalancer:
        servers: [{url: "http://portainer:9000"}]
    dozzle:
      loadBalancer:
        servers: [{url: "http://dozzle:8080"}]
    uptime-kuma:
      loadBalancer:
        servers: [{url: "http://uptime-kuma:3001"}]
