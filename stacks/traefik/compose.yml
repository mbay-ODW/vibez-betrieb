# Traefik (nur Datei-Konfiguration, kein Docker-Socket) + Authelia (2FA, LDAP-Gruppen) + Redis (Sitzungen)
# Netze: tunnel (cloudflared), fe-admin / fe-vibez / fe-vibez-testing (Frontends je Zone), link-ldap (Authelia -> LLDAP)
services:
  traefik:
    image: traefik:v3.7.17
    container_name: vibez-traefik
    restart: unless-stopped
    command: ["--configFile=/etc/traefik/traefik.yml"]
    env_file: [/srv/vibez/secrets/traefik/traefik.env]   # VN_HOST, VN_PROXY_SECRET, VN_PROXY_SECRET_TESTING
    volumes:
      - /opt/vibez/repo/config/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /opt/vibez/repo/config/traefik/dynamic:/etc/traefik/dynamic:ro
      - /srv/vibez/logs/traefik:/var/log/traefik
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--configFile=/etc/traefik/traefik.yml"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [tunnel, fe-admin, fe-vibez, fe-vibez-testing, intern]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m

  authelia:
    image: authelia/authelia:4.39.28
    container_name: vibez-authelia
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /secrets/jwt_secret
      AUTHELIA_SESSION_SECRET_FILE: /secrets/session_secret
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /secrets/storage_key
      AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE: /secrets/ldap_authelia_pass
    volumes:
      - /opt/vibez/repo/config/authelia/configuration.yml:/config/configuration.yml:ro
      - /srv/vibez/admin/authelia:/data
      - /srv/vibez/secrets/authelia:/secrets:ro
    depends_on: [redis]
    networks: [intern, link-ldap]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m

  redis:
    image: redis:8.8.4-alpine
    container_name: vibez-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [intern]
    read_only: true
    tmpfs: ["/data"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m

networks:
  intern:
    internal: true
  tunnel:
    external: true
  fe-admin:
    external: true
  fe-vibez:
    external: true
  fe-vibez-testing:
    external: true
  link-ldap:
    external: true
