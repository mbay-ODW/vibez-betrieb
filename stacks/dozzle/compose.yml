# Dozzle – Container-Protokolle (hinter Authelia, nur vibez-infra_admin). Docker nur lesend über Socket-Proxy.
services:
  dozzle:
    image: amir20/dozzle:v11.4.3
    container_name: vibez-dozzle
    restart: unless-stopped
    environment:
      DOZZLE_REMOTE_HOST: tcp://socket-proxy:2375
      DOZZLE_AUTH_PROVIDER: forward-proxy
      DOZZLE_NO_ANALYTICS: "true"
    depends_on: [socket-proxy]
    networks: [fe-admin, socket-proxy]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m

  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.7
    container_name: vibez-dozzle-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      INFO: "1"
      EVENTS: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket-proxy]
    read_only: true
    tmpfs: ["/run"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m

networks:
  fe-admin:
    external: true
  socket-proxy:
    internal: true
