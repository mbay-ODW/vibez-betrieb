# cloudflared – lokal verwalteter Tunnel (Konfiguration liegt hier im Repo, Zugangsdaten nur auf dem Server)
# TUNNEL_ID und credentials.json entstehen bei `cloudflared tunnel create vibez-prod` (siehe docs/deployment.md).
tunnel: TUNNEL_ID
credentials-file: /etc/cloudflared/credentials.json
no-autoupdate: true

ingress:
  # eigentliche Adresse der App (Custom Hostname über Cloudflare for SaaS)
  - hostname: nachweise.vibez-jugendhilfe.de
    service: http://traefik:80
  # Fallback-Origin der Hilfszone (Cloudflare prüft diese Adresse)
  - hostname: origin.vibez-edge.de
    service: http://traefik:80
  - service: http_status:404
