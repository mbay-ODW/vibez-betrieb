# Traefik – statische Konfiguration (Echtbetrieb VIBEZ Nachweise, ohne Cloudflare)
# Traefik nimmt die Verbindungen direkt aus dem Internet an und beendet TLS selbst (Let's Encrypt).

global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    # keinem vorgeschalteten Proxy vertrauen: X-Forwarded-* aus dem Internet werden verworfen,
    # die App sieht als Client-IP die echte Gegenstelle
    forwardedHeaders:
      insecure: false
    transport:
      respondingTimeouts:
        readTimeout: 60s
        writeTimeout: 120s   # Druckstapel/ZIP können etwas dauern
        idleTimeout: 180s
    http:
      tls:
        certResolver: letsencrypt
        options: modern@file
  # nur für den Healthcheck im Container (kein Router, nicht veröffentlicht)
  ping:
    address: ":8082"

certificatesResolvers:
  letsencrypt:
    acme:
      storage: /acme/acme.json
      tlsChallenge: {}          # Validierung über Port 443 (TLS-ALPN-01), kein DNS-Zugriff nötig

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

api:
  dashboard: false

ping:
  entryPoint: ping

log:
  level: WARN

# Zugriffsprotokoll: nur Metadaten, 14 Tage (Rotation: host/logrotate-vibez); CrowdSec wertet es aus
accessLog:
  filePath: /var/log/traefik/access.log
  format: common
  bufferingSize: 0
