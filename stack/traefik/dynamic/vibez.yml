# Traefik – dynamische Konfiguration: Router, Dienst, Middlewares, TLS
http:
  routers:
    vibez:
      entryPoints: [websecure]
      rule: 'Host(`{{ env "VN_HOST" }}`)'
      service: vibez-app
      middlewares: [kopfzeilen, bremse, groesse]
      tls:
        certResolver: letsencrypt
    # alle anderen Hostnamen (z. B. Aufruf über die nackte IP) bekommen Traefiks 404

  services:
    vibez-app:
      loadBalancer:
        servers:
          - url: "http://vibez-app:8000"
        healthCheck:
          path: /health
          interval: 30s
          timeout: 5s

  middlewares:
    kopfzeilen:
      headers:
        # CSP, X-Frame-Options, Referrer-Policy u. a. setzt die App selbst
        stsSeconds: 31536000
        stsIncludeSubdomains: false
        contentTypeNosniff: true
        customRequestHeaders:
          # ohne Cloudflare davor darf niemand eine „echte IP“ vorgaukeln: Header entfernen
          Cf-Connecting-Ip: ""
          X-Real-Ip: ""
        customResponseHeaders:
          Server: ""
          X-Powered-By: ""
          X-Robots-Tag: "noindex, nofollow"

    # Ratenbegrenzung je Client-IP (direkte Verbindung, kein Proxy davor)
    bremse:
      rateLimit:
        average: 20
        period: 1s
        burst: 60

    # Formulare sind klein; Unterschriften als PNG max. ~0,5 MB
    groesse:
      buffering:
        maxRequestBodyBytes: 2000000

tls:
  options:
    modern:
      minVersion: VersionTLS12
      sniStrict: true
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
