# VIBEZ Nachweise – Echtbetrieb auf dem VPS (Docker Compose), ohne Cloudflare
#
# Weg einer Anfrage:  Browser -> (DNS bei All-Inkl: A nachweise -> Server-IP) -> Traefik :443 (TLS, Let's Encrypt)
#                     -> App -> MongoDB Atlas (Frankfurt)
# Offen sind nur 80 (Weiterleitung auf HTTPS) und 443. SSH nur über Tailscale.
# CrowdSec (auf dem Host) liest das Traefik-Zugriffsprotokoll und sperrt Angreifer per Firewall.
#
# Netze:
#   web    – traefik <-> app          (intern, kein Internet)
#   atlas  – app -> MongoDB Atlas     (ausgehend; Atlas lässt nur die IP dieses Servers zu)
#   edge   – traefik nach außen       (veröffentlichte Ports 80/443)
#
# Alle Werte kommen aus .env (Vorlage: .env.example, Datei nur auf dem Server, chmod 600).
# Versionen sind fest gepinnt; Aktualisieren nur über deploy.sh (siehe docs/betriebshandbuch.md).

name: vibez

services:
  traefik:
    image: traefik:${TRAEFIK_VERSION}
    container_name: vibez-traefik
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yml
    environment:
      VN_HOST: ${VN_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - /srv/vibez/acme:/acme                 # Let's-Encrypt-Zertifikat (acme.json, chmod 600)
      - ./logs/traefik:/var/log/traefik       # Zugriffsprotokoll, liest CrowdSec
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--configFile=/etc/traefik/traefik.yml"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [edge, web]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m

  app:
    image: ghcr.io/mbay-odw/vibez-nachweise:${VN_VERSION}
    container_name: vibez-app
    restart: unless-stopped
    environment:
      # mongodb+srv://<app-benutzer>:<passwort>@<cluster>.mongodb.net/vibez?retryWrites=true&w=majority&appName=vibez-nachweise
      MONGODB_URI: ${MONGODB_URI}
      VN_SECRET_KEY: ${VN_SECRET_KEY}
      VN_ADMIN_PASSWORD: ${VN_ADMIN_PASSWORD}
      VN_DEMO: "0"
      VN_SECURE_COOKIE: "1"
      VN_HOSTS: ${VN_HOST}          # nur dieser Hostname wird angenommen
      VN_IDLE_MINUTES: "120"        # Abmeldung nach 2 Stunden Inaktivität
      VN_2FA_PFLICHT: verwaltung    # Zwei-Faktor-Anmeldung Pflicht für die Verwaltung
      TZ: Europe/Berlin
    networks: [web, atlas]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m

networks:
  edge: {}
  web:
    internal: true
  atlas: {}
