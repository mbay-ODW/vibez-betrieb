# VIBEZ Nachweise – Echtbetrieb auf dem VPS (Docker Compose)
#
# Weg einer Anfrage:  Browser -> Cloudflare (WAF, TLS) -> Tunnel -> cloudflared -> traefik -> app -> MongoDB Atlas (Frankfurt)
# Der Server hat KEINE offenen Ports: cloudflared baut die Verbindung zu Cloudflare von innen nach außen auf.
#
# Netze:
#   edge   – cloudflared <-> traefik (ausgehend ins Internet, nur für den Tunnel)
#   web    – traefik <-> app          (intern, kein Internet)
#   atlas  – app -> MongoDB Atlas     (ausgehend; Atlas lässt nur die IP dieses Servers zu)
#
# Alle Werte kommen aus .env (Vorlage: .env.example, Datei nur auf dem Server, chmod 600).
# Versionen sind fest gepinnt; Aktualisieren nur über deploy.sh (siehe docs/betriebshandbuch.md).

name: vibez

services:
  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION}
    container_name: vibez-cloudflared
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    networks: [edge]
    depends_on:
      traefik:
        condition: service_healthy
    read_only: true
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m

  traefik:
    image: traefik:${TRAEFIK_VERSION}
    container_name: vibez-traefik
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yml
    environment:
      VN_HOST: ${VN_HOST}
      VN_PROXY_SECRET: ${VN_PROXY_SECRET}   # setzt Traefik als X-Proxy-Secret (dynamic/vibez.yml)
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./logs/traefik:/var/log/traefik
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--configFile=/etc/traefik/traefik.yml"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      edge:
        ipv4_address: 172.30.0.10
      web: {}
      vibez-admin: {}   # Verwaltungsoberflächen und Authelia (Stack stack-admin)
    read_only: true
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m

  app:
    image: ghcr.io/mbay-odw/vibez-nachweise:${VN_VERSION}
    container_name: vibez-app
    restart: unless-stopped
    environment:
      # mongodb+srv://<cluster>.mongodb.net/vibez?authMechanism=MONGODB-X509&tlsCertificateKeyFile=/run/secrets/atlas-app.pem&…
      MONGODB_URI: ${MONGODB_URI}
      VN_SECRET_KEY: ${VN_SECRET_KEY}
      VN_ADMIN_PASSWORD: ${VN_ADMIN_PASSWORD}
      VN_DEMO: "0"
      VN_SECURE_COOKIE: "1"
      VN_HOSTS: ${VN_HOST}          # nur dieser Hostname wird angenommen
      VN_IDLE_MINUTES: "120"        # Abmeldung nach 2 Stunden Inaktivität (lokaler Modus; sonst Authelia)
      VN_AUTH: ${VN_AUTH:-lokal}    # authelia = Anmeldung über Authelia/LDAP (ab 0.3.0)
      VN_PROXY_SECRET: ${VN_PROXY_SECRET}
      VN_LOGOUT_URL: https://auth.vibez-odenwald.de/logout
      TZ: Europe/Berlin
    volumes:
      # X.509-Zertifikat für Atlas (Benutzer „prod“), Besitzer UID 10001, Rechte 400
      - ./secrets/atlas-app.pem:/run/secrets/atlas-app.pem:ro
    networks: [web, atlas]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m

  usersync:
    # Abgleich LDAP-Gruppen -> App-Konten (ab 0.3.0), deaktiviert Konten ohne App-Gruppe
    image: ghcr.io/mbay-odw/vibez-nachweise:${VN_VERSION}
    container_name: vibez-usersync
    restart: unless-stopped
    command: ["python", "-m", "app.usersync"]
    profiles: ["authelia"]          # startet nur mit COMPOSE_PROFILES=authelia (siehe .env)
    environment:
      MONGODB_URI: ${MONGODB_URI}
      VN_LDAP_URL: ldap://lldap:3890
      VN_LDAP_BASE_DN: dc=vibez-odenwald,dc=de
      VN_LDAP_BIND_DN: uid=vibez-usersync,ou=people,dc=vibez-odenwald,dc=de
      VN_LDAP_PASSWORD_FILE: /run/secrets/ldap_usersync_pass
      VN_SYNC_MINUTEN: "10"
      TZ: Europe/Berlin
    volumes:
      - ./secrets/atlas-app.pem:/run/secrets/atlas-app.pem:ro
      - ../stack-admin/secrets/ldap_usersync_pass:/run/secrets/ldap_usersync_pass:ro
    networks: [atlas, vibez-ldap]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  web:
    internal: true
  atlas: {}
  vibez-ldap:
    external: true    # wird von stack-admin angelegt (intern)
  vibez-admin:
    external: true    # wird von stack-admin angelegt (intern, kein Internet)
